name: jarvis

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: jarvis-postgres
    network_mode: host
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis-pass
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}