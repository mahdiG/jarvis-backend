            $ref: '#/definitions/models.Conversation'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fiber.Map'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: Get a conversation
      tags:
      - Conversations
    patch:
      consumes:
