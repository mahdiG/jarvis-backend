basePath: /v1
definitions:
  fiber.Map:
    additionalProperties: {}
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  models.Conversation:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    required:
    - title
    type: object
  models.File:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
      url:
        type: string
    type: object
  models.Message:
    properties:
      content:
        type: string
      conversationID:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: string
      role:
        type: string
      updatedAt:
        type: string
    required:
    - content
    - conversationID
    - role
    type: object
  models.Note:
    properties:
      content:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      files:
        items:
          $ref: '#/definitions/models.File'
        type: array
      id:
        type: string
      tags:
        items:
          $ref: '#/definitions/models.Tag'
        type: array
      title:
        type: string
      updatedAt:
        type: string
    required:
    - title
    type: object
  models.Tag:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    required:
    - name
    type: object
  models.Task:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      doneAt:
        type: string
      id:
        type: string
      parentID:
        type: string
      scheduledFrom:
        type: string
      scheduledTo:
        type: string
      score:
        type: number
      scoreUnit:
        type: string
      tags:
        items:
          $ref: '#/definitions/models.Tag'
        type: array
      targetScore:
        description: Target score for binary (done/undone) task is 1
        minimum: 0
        type: number
      title:
        type: string
      updatedAt:
        type: string
    required:
    - title
    type: object
host: localhost:3000
info:
  contact:
    name: Mahdi
  description: AI Life OS backend — tasks, notes, conversations, and AI chat.
  title: Jarvis API
  version: "1.0"
paths:
  /conversations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Conversation'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fiber.Map'
      summary: List all conversations
      tags:
      - Conversations
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversation to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.Conversation'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
