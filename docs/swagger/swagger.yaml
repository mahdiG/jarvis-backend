basePath: /v1
definitions:
  controllers.ErrorDetail:
    properties:
      fields:
        description: Fields contains per‑field validation errors (usually for 422
          responses).
        items:
          $ref: '#/definitions/controllers.FieldError'
        type: array
      message:
        description: Message is a human‑readable description of the error.
        type: string
    type: object
  controllers.FieldError:
    properties:
      field:
        description: the JSON fname
        type: string
      message:
        description: human‑readable reason
        type: string
      tag:
        description: validation tag that failed
        type: string
    type: object
  controllers.Meta:
    properties:
      pagination:
        allOf:
        - $ref: '#/definitions/controllers.Pagination'
        description: |-
          Pagination contains cursor/offset‑based pagination info.
          It is nil for endpoints that do not paginate.
      requestID:
        description: RequestID can be used for tracing requests across services.
        type: string
      warnings:
        description: Warnings contains non‑fatal messages (e.g. “this endpoint is
          deprecated”).
        items:
          type: string
        type: array
    type: object
  controllers.Pagination:
    properties:
      page:
        description: Page is the current page number (1‑based).
        type: integer
      pageSize:
        description: PageSize is the maximum number of items per page.
        type: integer
      totalItems:
        description: TotalItems is the total number of items across all pages.
        format: int64
        type: integer
      totalPages:
        description: TotalPages is the total number of pages (TotalItems / PageSize).
        type: integer
    type: object
  controllers.Response-any:
    properties:
      data: {}
      error:
        $ref: '#/definitions/controllers.ErrorDetail'
      meta:
        $ref: '#/definitions/controllers.Meta'
    type: object
  controllers.Response-array_models_Note:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Note'
        type: array
      error:
        $ref: '#/definitions/controllers.ErrorDetail'
      meta:
        $ref: '#/definitions/controllers.Meta'
    type: object
  controllers.Response-models_Note:
    properties:
      data:
        $ref: '#/definitions/models.Note'
      error:
        $ref: '#/definitions/controllers.ErrorDetail'
      meta:
        $ref: '#/definitions/controllers.Meta'
    type: object
  fiber.Map:
    additionalProperties: {}
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  models.Conversation:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    required:
    - title
    type: object
  models.File:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
      url:
        type: string
    type: object
  models.Message:
    properties:
      content:
        type: string
      conversationID:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: string
      role:
        type: string
      updatedAt:
        type: string
    required:
    - content
    - conversationID
    - role
    type: object
  models.Note:
    properties:
      content:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      files:
        items:
          $ref: '#/definitions/models.File'
        type: array
      id:
        type: string
      tags:
        items:
          $ref: '#/definitions/models.Tag'
        type: array
      title:
        type: string
      updatedAt:
        type: string
    required:
    - title
    type: object
  models.Tag:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    required:
    - name
    type: object
  models.Task:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      doneAt:
        type: string
      id:
        type: string
      parentID:
        type: string
      scheduledFrom:
        type: string
      scheduledTo:
        type: string
      score:
        type: number
      scoreUnit:
        type: string
      tags:
        items:
          $ref: '#/definitions/models.Tag'
        type: array
      targetScore:
        description: Target score for binary (done/undone) task is 1
        minimum: 0
        type: number
      title:
        type: string
      updatedAt:
        type: string
    required:
    - title
    type: object
